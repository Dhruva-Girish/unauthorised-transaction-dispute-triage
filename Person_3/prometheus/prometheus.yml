global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "dispute-backend-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "ml-fraud-model-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ml_service:8001"]
